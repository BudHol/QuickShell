<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Deck – QuickCards – Study Smarter</title>
    <meta name="description" content="Create flashcard decks and study them anywhere. No sign-up needed." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="../../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="/">QuickCards</a>
        <a class="nav-link" href="/decks">My Decks</a>
      </div>
    </header>

    <main class="page-main">
      <section class="container placeholder-card">
        <h1>Edit Deck</h1>
        <p id="edit-loading" class="loading-text">Loading this deck...</p>
        <form id="edit-deck-form" class="deck-form" novalidate>
          <label class="field-label" for="deck-title">Deck Title</label>
          <input
            id="deck-title"
            class="text-input"
            type="text"
            placeholder="Chapter 4 Vocabulary"
            autocomplete="off"
          />

          <div id="flashcard-rows" class="flashcard-rows" aria-live="polite"></div>

          <button id="add-card" type="button" class="btn btn-secondary">+ Add another card</button>

          <p id="form-error" class="form-error" hidden></p>

          <div class="actions form-actions">
            <button type="submit" class="btn btn-primary">Save Changes</button>
            <a id="cancel-link" class="btn btn-secondary" href="/decks">Cancel</a>
          </div>
        </form>
      </section>
    </main>

    <script type="module" src="../../scripts/edit-page.js"></script>
  </body>
</html>
