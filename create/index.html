<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create a Deck – QuickCards – Study Smarter</title>
    <meta name="description" content="Create flashcard decks and study them anywhere. No sign-up needed." />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="../index.html">QuickCards</a>
        <a class="nav-link" href="../decks/index.html">My Decks</a>
      </div>
    </header>

    <main class="page-main">
      <section class="container placeholder-card">
        <h1>Create a Deck</h1>
        <form id="create-deck-form" class="deck-form" novalidate>
          <label class="field-label" for="deck-title">Deck Title</label>
          <input
            id="deck-title"
            class="text-input"
            type="text"
            placeholder="Chapter 4 Vocabulary"
            autocomplete="off"
          />

          <div id="flashcard-rows" class="flashcard-rows" aria-live="polite"></div>

          <button id="add-card" type="button" class="btn btn-secondary">+ Add another card</button>

          <p id="form-error" class="form-error" hidden></p>

          <button type="submit" class="btn btn-primary">Save Deck</button>
        </form>
      </section>
    </main>
    <script type="module" src="../scripts/create-page.js"></script>
  </body>
</html>
